<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--fg);font:400 16px/24px var(--font-sans)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--fg-secondary);margin-top:var(--space-2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)}
.tile{display:flex;align-items:center;justify-content:center;gap:12px;padding:20px;min-height:130px;outline:1px solid var(--hairline);outline-offset:-1px}
.tile img{width:76px;height:auto;display:block}
.w2{grid-column:span 2}
.cream{background:var(--cream)}.cyan{background:var(--dark-cyan)}.sage{background:var(--ash-grey)}.coffee{background:var(--dark-coffee)}.copper{background:var(--rosy-copper)}
</style></head><body>
<div class="grid">
<div><div class="tile cream"><img src="../../assets/Logos/late-batch-black.svg" alt="Late Batch Bakery, black"><img src="../../assets/Logos/late-batch-teal.svg" alt="teal"></div><div class="cap">Cream: black, teal</div></div>
<div><div class="tile cream"><img src="../../assets/Logos/late-batch-copper.svg" alt="copper"><img src="../../assets/Logos/late-batch-brown.svg" alt="brown"></div><div class="cap">Cream: copper, brown</div></div>
<div><div class="tile cyan"><img src="../../assets/Logos/late-batch-cream.svg" alt="cream"><img src="../../assets/Logos/late-batch-sage.svg" alt="sage"></div><div class="cap">Dark cyan: cream, sage</div></div>
<div><div class="tile sage"><img src="../../assets/Logos/late-batch-brown.svg" alt="brown"></div><div class="cap">Ash grey: brown</div></div>
<div><div class="tile coffee"><img src="../../assets/Logos/late-batch-cream.svg" alt="cream"><img src="../../assets/Logos/late-batch-copper.svg" alt="copper"><img src="../../assets/Logos/late-batch-sage.svg" alt="sage"></div><div class="cap">Dark coffee: cream, copper, sage</div></div>
<div><div class="tile copper"><img src="../../assets/Logos/late-batch-cream.svg" alt="cream"></div><div class="cap">Rosy copper: cream</div></div>
</div></body></html>
