<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--fg);font:400 16px/24px var(--font-sans)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--fg-secondary);margin-top:var(--space-2)}
body{text-align:center}
section{margin-bottom:var(--space-12)}
h2{margin:0 0 var(--space-8);font-family:var(--font-display);font-weight:400;font-size:64px;line-height:60px;text-transform:uppercase;letter-spacing:.02em}
.row{display:grid;gap:var(--space-4);justify-content:center}.r2{grid-template-columns:repeat(2,minmax(0,220px))}.r3{grid-template-columns:repeat(3,minmax(0,220px))}
figure{margin:0}img{display:block;width:100%;aspect-ratio:1/1.1;object-fit:cover;border-radius:var(--radius-none)}
figcaption{text-align:center}
</style></head><body>
<section><h2 style="color:var(--category-bread)">Bread</h2><div class="row r2"><figure><img src="../../assets/Photography/loaf.png" alt="Loaf"><figcaption class="cap" style="color:var(--category-bread)">Loaf</figcaption></figure><figure><img src="../../assets/Photography/baguette.png" alt="Baguette"><figcaption class="cap" style="color:var(--category-bread)">Baguette</figcaption></figure></div></section>
<section><h2 style="color:var(--category-cookies)">Cookies</h2><div class="row r2"><figure><img src="../../assets/Photography/cookie-ny-chocolate.png" alt="NY chocolate"><figcaption class="cap" style="color:var(--category-cookies)">NY chocolate</figcaption></figure><figure><img src="../../assets/Photography/cookie-white-chocolate.png" alt="White chocolate"><figcaption class="cap" style="color:var(--category-cookies)">White chocolate</figcaption></figure></div></section>
<section><h2 style="color:var(--category-croissants)">Croissants</h2><div class="row r3"><figure><img src="../../assets/Photography/croissant-butter.png" alt="Butter"><figcaption class="cap" style="color:var(--category-croissants)">Butter</figcaption></figure><figure><img src="../../assets/Photography/croissant-pistachio.png" alt="Pistachio"><figcaption class="cap" style="color:var(--category-croissants)">Pistachio</figcaption></figure><figure><img src="../../assets/Photography/croissant-chocolate.png" alt="Chocolate"><figcaption class="cap" style="color:var(--category-croissants)">Chocolate</figcaption></figure></div></section>
</body></html>
